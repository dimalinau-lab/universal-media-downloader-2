<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>UMD Sender</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      width: 320px;
      background: #181b20;
      color: #ffffff;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: auto;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .page-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .page-title {
      font-size: 12px;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: #0078d4;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1084d9;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .notify {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .notify-success {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }
    .notify-error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo">
    <span class="header-title">UMD Sender</span>
    <span id="statusBadge" class="status-badge status-offline">Проверка...</span>
  </div>

  <div class="page-card">
    <div id="pageTitle" class="page-title">Загрузка...</div>
    <div id="pageUrl" class="page-url">...</div>
  </div>

  <div class="btn-group">
    <button id="btnDownloadVideo" class="btn btn-primary">
      <span>🎬</span> Скачать видео
    </button>
    <button id="btnDownloadAudio" class="btn btn-secondary">
      <span>🎵</span> Скачать аудио (MP3)
    </button>
  </div>

  <div id="notifyBox" class="notify"></div>

  <script src="popup.js"></script>
</body>
</html>
